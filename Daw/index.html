<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xaza Live</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="logo">XAZA<span>live</span></div>
  <button id="btnPlay" title="Reproducir / parar (Espacio)">▶</button>
  <button id="btnStop" title="Parar">■</button>
  <label class="bpm">BPM <input id="bpm" type="number" min="40" max="240" value="120"></label>
  <button id="btnMetro" title="Metrónomo">Metro</button>
  <button id="btnRec" title="Grabar notas en vivo (clip seleccionado)">● Rec</button>
  <button id="btnTap" title="Tap tempo">Tap</button>
  <label class="bpm">Swing <input id="swing" type="range" min="0" max="0.5" step="0.01" value="0" style="width:60px"></label>
  <span id="pos">1.1.1</span>
  <nav>
    <button id="tabSession" class="on">Session</button>
    <button id="tabArr">Arrangement</button>
    <button id="tabMixer">Mixer</button>
    <button id="tabImm">Inmersivo 3D</button>
  </nav>
  <span class="grow"></span>
  <canvas id="spec" width="110" height="24" title="Espectro del master"></canvas>
  <canvas id="masterMeter" width="80" height="14"></canvas>
  <button id="btnUndo" title="Deshacer (Ctrl+Z)">↶</button><button id="btnRedo" title="Rehacer (Ctrl+Y)">↷</button>
  <button id="btnAddM" title="Añadir pista MIDI">+ MIDI</button><button id="btnAddA" title="Añadir pista de audio">+ Audio</button>
  <button id="btnMic" title="Grabar audio del micrófono en el clip seleccionado">● Mic</button>
  <button id="btnHelp" title="Atajos">?</button>
  <button id="btnNew">Nuevo</button>
  <button id="btnSave">Guardar</button>
  <button id="btnLoad">Abrir…</button>
  <button id="btnExport">Exportar WAV</button>
  <input id="fileIn" type="file" accept=".json,application/json" hidden>
  <input id="audioIn" type="file" accept="audio/*" hidden>
</header>
<div id="status"></div>
<div id="help" hidden></div>
<main>
  <section id="session"></section>
  <section id="arr" hidden></section>
  <section id="mixer" hidden></section>
  <section id="imm" hidden></section>
</main>
<footer id="bottom">
  <div class="tabs">
    <button id="tabClip" class="on">Clip (piano roll)</button>
    <button id="tabDev">Dispositivos</button>
    <span id="selInfo"></span>
  </div>
  <div id="clipPane"></div>
  <div id="devPane" hidden></div>
</footer>
<script src="engine.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
<script src="roll.js"></script>
<script src="mixer.js"></script>
<script src="arr.js"></script>
<script src="imm.js"></script>
<script src="extras.js"></script>
<script src="start.js"></script>
</body>
</html>
