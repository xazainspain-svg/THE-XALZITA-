name: Compilar Xaza FX (90 plugins VST3)

on:
  push:
    paths: ['Plugins90/**', '.github/workflows/build-plugins90.yml']
  workflow_dispatch:

jobs:
  dsp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prueba de estabilidad del DSP (90 efectos)
        working-directory: Plugins90
        run: |
          g++ -std=c++17 -O2 -fsanitize=address,undefined -I. test/dsp_test.cpp -o dsp_test
          ./dsp_test plugins.txt

  build-windows:
    needs: dsp-test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        category: [Filters, Dynamics, Distortion, Modulation, Time, Stereo, Creative]
    steps:
      - uses: actions/checkout@v4
      - name: Configurar (descarga JUCE)
        run: cmake -S Plugins90 -B build -DCMAKE_BUILD_TYPE=Release -DXFX_CATEGORY=${{ matrix.category }}
      - name: Compilar
        run: cmake --build build --config Release --parallel
      - name: Subir los .vst3
        uses: actions/upload-artifact@v4
        with:
          name: Xaza-FX-${{ matrix.category }}-VST3-Windows
          path: build/*_artefacts/Release/VST3/*.vst3
          if-no-files-found: error

  installer:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar los .vst3 de todas las categorias
        uses: actions/download-artifact@v4
        with:
          pattern: Xaza-FX-*-VST3-Windows
          path: vst3
          merge-multiple: true
      - name: Contar plugins
        shell: bash
        run: |
          n=$(find vst3 -maxdepth 1 -name "*.vst3" | wc -l)
          echo "plugins: $n"
          test "$n" -eq 90
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Crear el instalador .exe
        shell: bash
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DSrcDir=$PWD/vst3" Plugins90/installer.iss
      - name: Subir el instalador
        uses: actions/upload-artifact@v4
        with:
          name: Xaza-FX-90-Instalador-Windows
          path: Plugins90/Xaza-FX-90-Instalador.exe
          if-no-files-found: error
